apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
      version: blue
  template:
    metadata:
      labels:
        app: myapp
        version: blue
    spec:
      containers:
      - name: myapp
        image: europe-west3-docker.pkg.dev/commanding-fact-262609/my-docker-repo/myapp
        ports:
        - containerPort: 3000
